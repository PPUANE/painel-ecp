<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Monitoramento da rede — Painel de Gestão ECP</title><meta name="robots" content="noindex"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style id="app-style">:root{
  --navy:#15294B; --teal:#1C7674; --gold:#C49A1C;
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#15294B; --ink-2:#51607A; --ink-3:#7C889D; --line:#D6DCE6;
  --b0:#B04A33; --b1:#D4952B; --b2:#2A8783; --b3:#C49A1C;
  --b0-soft:#F3DCD5; --b1-soft:#F7E8CC; --b2-soft:#D5ECEA; --b3-soft:#F4EACB;
  --on-band:#FFFFFF; --on-gold:#15294B;
  --serif:Cambria,"Source Serif 4",Georgia,serif;
  --sans:Calibri,Carlito,"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1729; --surface:#152239; --ink:#E7ECF4; --ink-2:#A9B5C9; --ink-3:#7E8BA3; --line:#2A3956;
    --teal:#46ABA7; --b2:#2F9A95;
    --b0-soft:#3A2420; --b1-soft:#3A3020; --b2-soft:#173634; --b3-soft:#3A3319;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1729; --surface:#152239; --ink:#E7ECF4; --ink-2:#A9B5C9; --ink-3:#7E8BA3; --line:#2A3956;
  --teal:#46ABA7; --b2:#2F9A95;
  --b0-soft:#3A2420; --b1-soft:#3A3020; --b2-soft:#173634; --b3-soft:#3A3319;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 56px}

/* Cabeçalho */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.top .prog{font-size:15px;color:var(--ink-2);margin:0 0 6px}
.top h1{font-size:clamp(26px,3.4vw,36px)}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.meta{font-size:15px;color:var(--ink-2);margin:8px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.small{padding:4px 10px;font-size:14px}
.btn.quiet{border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.notice{margin-top:14px;padding:10px 14px;border-left:4px solid var(--gold);background:var(--surface);font-size:15px;color:var(--ink-2)}

/* Régua */
.regua{padding:34px 0 30px}
.regua .lead{font-family:var(--serif);font-size:clamp(21px,2.5vw,27px);max-width:30em;margin:0 0 6px}
.regua .sub{color:var(--ink-2);margin:0 0 30px;max-width:62em}
.scale{position:relative;margin:0 40px}
.bands{position:relative;display:flex;height:16px;border-radius:3px;overflow:hidden}
.bands span{display:block;height:100%}
.ticks{position:relative;height:62px;font-size:13px;color:var(--ink-3)}
.ticks .t{position:absolute;top:6px;transform:translateX(-50%);white-space:nowrap}
.ticks .band-name{position:absolute;top:22px;transform:translateX(-50%);white-space:nowrap;color:var(--ink-2)}
.markers{position:relative}
.mk{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;bottom:-8px}
.mk .lbl{font-size:14px;line-height:1.2;text-align:center;white-space:nowrap;background:var(--bg);padding:1px 4px;border-radius:3px}
.mk .lbl b{font-family:var(--serif);font-size:19px;display:block}
.mk .stem{width:1.5px;background:var(--ink-3)}
.mk .dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--ink)}
.mk.alt .dot{background:var(--bg)!important;box-shadow:0 0 0 2px var(--ink-2)}
.mk.alt .lbl{color:var(--ink-2)}
.ref{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--gold);transform:translateX(-50%);z-index:2}
.ref-name{position:absolute;top:40px;transform:translateX(calc(-100% + 1px));font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap;border-right:3px solid var(--gold);padding-right:6px}
@media (max-width:600px){.ticks .band-name{display:none}.ref-name{top:22px}}

/* Seções */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.card h2{font-size:22px;margin-bottom:4px}
.card{scroll-margin-top:60px}
.card .desc{color:var(--ink-2);font-size:15px;margin:0 0 16px}
.sec{margin-top:20px}
.scroll{overflow-x:auto}

/* Mapa de calor */
table.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:15px}
.heat th{font-weight:600;font-size:13px;color:var(--ink-2);text-align:center;vertical-align:bottom;padding:2px 4px;line-height:1.2}
.heat th.row{text-align:left;font-size:15px;color:var(--ink);white-space:nowrap;padding-right:8px}
.heat th .w{display:block;font-weight:400;color:var(--ink-3)}
.heat td{text-align:center;padding:10px 4px;border-radius:4px;font-weight:700;min-width:64px;font-size:16px}
.heat th{max-width:150px}
.heat tr.avg th.row,.heat tr.avg td{border-top:0}
.heat tr.avg th.row{font-style:italic;color:var(--ink-2)}
.heat td.idx{background:transparent;color:var(--ink);font-family:var(--serif);font-size:17px}
.f0{background:var(--b0);color:var(--on-band)} .f1{background:var(--b1);color:#2A1E05}
.f2{background:var(--b2);color:var(--on-band)} .f3{background:var(--b3);color:var(--on-gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.callout{margin:16px 0 0;font-size:15px;padding-top:12px;border-top:1px solid var(--line)}
.alt-inst{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.alt-inst h3{font-size:16px;margin-bottom:8px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:14px}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%}

/* Lacunas */
.gaps{width:100%;border-collapse:collapse;font-size:15px}
.gaps th{font-size:13px;font-weight:600;color:var(--ink-2);text-align:center;padding:0 3px 6px}
.gaps th:first-child,.gaps th:nth-child(2){text-align:left}
.gaps td{padding:8px 3px;border-top:1px solid var(--line);vertical-align:top}
.gaps td.cod{font-weight:700;white-space:nowrap;padding-right:8px}
.gaps td.crit{color:var(--ink-2);line-height:1.3}
.gaps td.crit span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gaps td.nd{text-align:center}
.nd i,.legend i.nx{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle}
.n0{background:var(--b0)} .n1{background:var(--b1)} .n2{background:var(--b2)} .n3{background:var(--b3)} .nx{background:transparent;border:1.5px dashed var(--ink-3)}
.linkbtn{background:none;border:0;padding:0;margin-top:12px;color:var(--teal);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:15px}

/* Pautas */
.matrix{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:1fr 1fr auto;gap:10px}
.axis-y{grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:13px;color:var(--ink-2);display:flex;justify-content:space-around}
.axis-x{grid-column:2/4;display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:13px;color:var(--ink-2)}
.quad{border-radius:8px;padding:14px;min-height:140px;border:1px solid var(--line)}
.quad h3{font-size:17px;margin-bottom:2px}
.quad .qd{font-size:13px;color:var(--ink-2);margin:0 0 10px}
.quad.q-ja{background:var(--b3-soft);border-color:var(--b3)}
.quad.q-plan{background:var(--b2-soft)}
.quad.q-enc{background:var(--surface)}
.quad.q-rev{background:var(--surface);border-style:dashed}
.pauta{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px}
.pauta b{display:block;font-size:16px;line-height:1.25}
.pauta p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.pauta .tag{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--teal)}
.empty{font-size:14px;color:var(--ink-3);font-style:italic}
@media (max-width:700px){.matrix{grid-template-columns:1fr;grid-template-rows:none}.axis-y,.axis-x{display:none}}
.draft{font-size:14px;color:var(--ink-2);margin:-8px 0 14px}

/* Editor de pautas */
.editor{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.ed-row{display:grid;grid-template-columns:2fr 2.4fr 1fr 1fr 1fr auto;gap:8px;align-items:start;margin-bottom:10px}
.ed-row input,.ed-row select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:14px}
.ed-head{font-size:13px;color:var(--ink-2);font-weight:600}
@media (max-width:800px){.ed-row{grid-template-columns:1fr 1fr}.ed-head{display:none}}

/* Diálogo */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(720px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,20,40,.45)}
.dlg{padding:22px;overflow:auto;max-height:88vh}
.dlg h2{font-size:22px;margin-bottom:6px}
.drop{margin:14px 0;border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--ink-2);cursor:pointer}
.drop.on{border-color:var(--teal);background:var(--b2-soft)}
.drop input{display:none}
.lst{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.lst td,.lst th{padding:7px 6px;border-top:1px solid var(--line);text-align:left}
.lst th{font-size:13px;color:var(--ink-2);border-top:0}
.st-new{color:var(--teal);font-weight:600}.st-upd{color:var(--gold);font-weight:600}.st-err{color:var(--b0);font-weight:600}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:15px;z-index:50;max-width:90vw}

.notes{overflow-wrap:anywhere;margin-top:26px;font-size:14px;color:var(--ink-2);max-width:70em}
.notes h2{font-size:17px;margin-bottom:6px;color:var(--ink)}
.notes p{margin:0 0 6px}

@media print{
  body{background:#fff}.acts,.linkbtn,.editor,.notice,dialog{display:none!important}
  .card{break-inside:avoid;border-color:#bbb}.wrap{padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2 ===== */
:root{--s0:#1C7674;--s1:#C49A1C;--s2:#B04A33;--s3:#15294B;--s4:#7A5AA6;--s5:#4F8A3C;
  --ok:#2E7D4F;--ok-soft:#DDEFE3;--warn:#B7791F;--warn-soft:#F8EBCF;--bad:#B04A33;--bad-soft:#F5DDD6;--na:#7C889D;--na-soft:#E6EAF0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s3:#8FB3E8;--ok:#5DBB82;--ok-soft:#18332A;--warn:#E0B04F;--warn-soft:#3A3020;--bad:#E07A62;--bad-soft:#3A2420;--na:#8C98AE;--na-soft:#223049}}
:root[data-theme="dark"]{--s3:#8FB3E8;--ok:#5DBB82;--ok-soft:#18332A;--warn:#E0B04F;--warn-soft:#3A3020;--bad:#E07A62;--bad-soft:#3A2420;--na:#8C98AE;--na-soft:#223049}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px 18px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.nav a{color:var(--ink-2);text-decoration:none;font-weight:600}.nav a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--na);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column}
.kpi b{font-family:var(--serif);font-size:32px;line-height:1.1;margin:2px 0}
.kl{font-size:14px;font-weight:600;color:var(--ink-2)}.ks{font-size:13px;color:var(--ink-3)}
.k-verde{border-left-color:var(--ok)}.k-amarelo{border-left-color:var(--warn)}.k-vermelho{border-left-color:var(--bad)}.k-neutro{border-left-color:var(--teal)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-verde{background:var(--ok-soft);color:var(--ok)}.c-amarelo{background:var(--warn-soft);color:var(--warn)}.c-vermelho{background:var(--bad-soft);color:var(--bad)}.c-cinza{background:var(--na-soft);color:var(--na)}
table.ind,table.ex,table.atd{width:100%;border-collapse:collapse;font-size:15px}
.ind th,.ind td,.ex th,.ex td,.atd th,.atd td{padding:9px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.ind thead th,.ex thead th,.atd thead th{border-top:0;font-size:13px;color:var(--ink-2);font-weight:600}
.ind tbody th{font-weight:600;max-width:340px}
.ind td.res{font-family:var(--serif);font-size:17px;font-weight:700;white-space:nowrap}
.ind td.res .sm{display:block;font-family:var(--sans);font-weight:400}
.sm{font-size:13px;color:var(--ink-3);font-weight:400}
.ex td,.atd td.num{font-weight:600}.ex td[class^="c-"],.atd td[class^="c-"]{border-radius:0}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.spark{display:inline-flex;align-items:flex-end;gap:3px;height:36px}
.spark i{display:block;width:9px;background:var(--teal);border-radius:2px 2px 0 0}
.fr{float:right;margin-left:12px}
.rd{border-radius:50%!important}
.alerts{list-style:none;margin:0;padding:0}
.al{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.ag{font-size:13px;font-weight:700;padding:2px 8px;border-radius:4px;align-self:start;text-align:center}
.al-grave .ag{background:var(--bad);color:#fff}.al-moderado .ag{background:var(--warn-soft);color:var(--warn)}.al-info .ag{background:var(--na-soft);color:var(--na)}
.aa{display:block;font-size:14px;color:var(--teal);margin-top:2px}
.evo{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.evo h3,.h3{font-size:16px;margin:0 0 8px}
.h3{margin-top:18px}
.evosvg{width:100%;max-width:720px;min-width:520px;height:auto;display:block}
.evosvg .gl{stroke:var(--line)}.evosvg .gref{stroke:var(--gold);stroke-dasharray:4 3}
.evosvg .gt{font-size:11px;fill:var(--ink-3)}.evosvg .gn{font-size:12px;font-weight:700}
.venc{margin:0;padding-left:18px;font-size:15px}.venc li{margin:4px 0}
.heat th.row .w{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.heat td.dv{font-size:14px;white-space:nowrap;color:var(--ink-2)}
.ghost{position:absolute;bottom:1px;width:14px;height:14px;border-radius:50%;border:2px dashed var(--ink-2);background:var(--bg);transform:translateX(-50%);z-index:-1}
.em-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.em-row input{width:84px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);margin-left:6px}
.em-row input[type=date]{width:auto}
.pil{display:block;font-size:14px;font-weight:600;margin-bottom:10px}
.pil input{display:block;width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-weight:400}
@media (max-width:700px){.em-row{grid-template-columns:1fr}.al{grid-template-columns:1fr}}
@media print{.nav{display:none}}

/* ===== v3: páginas, filtros e gráficos ===== */
body{font-size:16px}
.wrap{padding-top:22px}
.top{border-bottom:0;padding-bottom:6px;align-items:center}
.top h1{font-size:clamp(24px,3vw,30px)}
.top .meta{margin-top:4px;font-size:14px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 14px;color:var(--ink-2);text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--gold)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:18px;text-align:center}
.filtro{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:14px 0 4px}
.fl{font-size:13px;font-weight:700;color:var(--ink-2);margin-right:4px}
.pchip,.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-3)}
.pchip.on{color:var(--ink);border-color:var(--ink-3);font-weight:600}
.pchip:not(.on) .sw{opacity:.3}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip span{opacity:.7;font-weight:700}
.linkbtn.small{font-size:13px;margin:0 0 0 6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;margin-right:6px;vertical-align:0}
.pchip .sw{margin-right:0}
.pg{padding-top:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.span1{grid-column:span 1}.span2{grid-column:span 2}.span3{grid-column:1/-1}
@media (max-width:900px){.g3{grid-template-columns:minmax(0,1fr)}.span1,.span2,.span3{grid-column:1/-1}}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.cd h2{font-size:19px;margin:0 0 10px}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cardtop h2{margin:0}
.cw{position:relative;width:100%}
.hint{font-size:13px;color:var(--ink-3);margin:-4px 0 8px}
.lead2{margin:0;font-size:16px;color:var(--ink-2)}
.lead2 b{color:var(--ink)}
.kpis{margin-top:4px;gap:14px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:700px){.kpis.k3{grid-template-columns:minmax(0,1fr)}}
.kpi{border-radius:12px;padding:14px 16px;border-left-width:4px}
.kpi b{font-size:34px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}

/* ===== Identidade visual: Escritório Compras Públicas ===== */
:root{
  --navy:#15234d; --blue:#2a4fda; --teal:#2a4fda; --gold:#2a4fda;
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#15234d; --ink-2:#4A5577; --ink-3:#7F88A3; --line:#DDE2EE;
  --b0:#D04B3C; --b1:#E3A11E; --b2:#2a4fda; --b3:#15234d; --on-band:#FFFFFF; --on-gold:#FFFFFF;
  --b0-soft:#FAE3E0; --b1-soft:#FBF0D8; --b2-soft:#E1E7FB; --b3-soft:#E4E8F3;
  --ok:#1E8E5A; --ok-soft:#DDF1E6; --warn:#B7791F; --warn-soft:#FBF0D8; --bad:#D04B3C; --bad-soft:#FAE3E0; --na:#8A92A8; --na-soft:#E9ECF3;
  --serif:"Geometrica","Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sans:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1330; --surface:#121C40; --ink:#E8ECF8; --ink-2:#AEB7D2; --ink-3:#7F89A8; --line:#26325C;
  --blue:#5C7BFF; --teal:#5C7BFF; --gold:#7F97FF; --b2:#4E6CF0; --b3:#8FA3E8; --on-gold:#0B1330;
  --b0-soft:#3A2024; --b1-soft:#3A3020; --b2-soft:#1B2A66; --b3-soft:#1A2550;
  --ok:#4CC38A; --ok-soft:#133528; --warn:#E6B04E; --warn-soft:#3A3020; --bad:#EE7A6A; --bad-soft:#3A2024; --na:#8C95B0; --na-soft:#1E2A52}}
:root[data-theme="dark"]{

#dlg-pdf{width:min(560px,94vw)}
.mp h2{color:#15234d}
.mp-d{margin:0 0 14px;font-size:14px;color:#15234d}
.mp-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.mp-n{font-size:13px;font-weight:700;color:#2a4fda}
.mp-lk{background:none;border:0;color:#2a4fda;font:inherit;font-size:13px;font-weight:700;padding:4px 8px;border-radius:6px;cursor:pointer}
.mp-lk:hover:not([disabled]){background:#E8EDFD}
.mp-g{border:1px solid #C3D1F5;border-radius:10px;margin:0 0 12px;padding:8px 12px 10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.mp-g legend{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#15234d;padding:0 6px}
.mp-i{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:14px;font-weight:600;color:#15234d;cursor:pointer;border-radius:6px}
.mp-i:hover{background:#F4F6FE}
.mp-i input{width:17px;height:17px;accent-color:#2a4fda;margin:0}
.mp-f{margin:0;font-size:13px;color:#15234d;background:#F4F6FE;border-radius:8px;padding:8px 12px}
@media (max-width:520px){.mp-g{grid-template-columns:1fr}}
.capturando main.pg .prox,.capturando main.pg .subnav,.capturando main.pg .btn,.capturando main.pg .more,.capturando main.pg .linkbtn{display:none!important}
.pc .pd{opacity:1!important;width:10px;height:10px;border-radius:50%}
.pd.sn-verde{background:#1E8E5A!important}.pd.sn-amarelo{background:#E3A11E!important}.pd.sn-vermelho{background:#C8412F!important}
.f2-leg{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:#15234d;margin-top:2px}
.f2-leg .pd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:8px}
.f2-leg .pd:first-child{margin-left:0}
.ts-esp{height:16px}
table.ts th.num{white-space:normal;min-width:86px;line-height:1.2}
.ts-def{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0 10px}
.ts-def div{background:#F4F6FE;border:1px solid #C3D1F5;border-radius:8px;padding:8px 10px}
.ts-def dt{font-size:12px;font-weight:700;color:#15234d;margin-bottom:2px}
.ts-def dd{margin:0;font-size:12px;line-height:1.35;color:#15234d}
@media (max-width:900px){.ts-def{grid-template-columns:1fr 1fr}}

  var at = atuais(), lista = lacunas(), usados = {};
  var linhas = cods.map(function (c) { return lista.find(function (l) { return !usados[l.chave] && l.cod.toUpperCase() === c && (usados[l.chave] = true); }); }).filter(Boolean);
  var n = 0;
  at.forEach(function (e, idx) {
    var ns = linhas.map(function (l) { return l.notas[idx]; }).filter(function (v) { return v != null; });
    if (ns.length && ns.reduce(function (a, v) { return a + v; }, 0) / ns.length <= 1) n++;

}

function lerArquivos(files) {
  if (!window.XLSX) { toast('A biblioteca de leitura de planilhas ainda não carregou. Tente de novo em alguns segundos.'); return; }
  var arr = Array.prototype.slice.call(files);
  Promise.all(arr.map(function (f) {
    return f.arrayBuffer().then(function (buf) {
      try { var r = lerArquivo(XLSX, XLSX.read(buf, { type: 'array' }), f.name); r.arquivo = f.name; return r; }
      catch (err) { return { arquivo: f.name, erro: err.message || 'Não foi possível ler este arquivo.' }; }
    });
  })).then(function (res) {
    var mapa = {};
    UI.pendentes.concat(res).forEach(function (p) { mapa[p.erro ? 'err:' + p.arquivo : p.tipo === 'atendimentos' ? 'atd' : chave(p.ecp)] = p; });
    UI.pendentes = Object.keys(mapa).map(function (k) { return mapa[k]; });
    reabrirDialogo();
  });
}
function reabrirDialogo() { render(); var d = document.getElementById('dlg'); if (d && !d.open) d.showModal(); ligarDrop(); }
function ligarDrop() {
  var fi = document.getElementById('fi'), dr = document.getElementById('drop');
  if (!fi) return;
  fi.onchange = function () { if (fi.files.length) lerArquivos(fi.files); };
  dr.ondragover = function (e) { e.preventDefault(); dr.classList.add('on'); };
  dr.ondragleave = function () { dr.classList.remove('on'); };
  dr.ondrop = function (e) { e.preventDefault(); dr.classList.remove('on'); if (e.dataTransfer.files.length) lerArquivos(e.dataTransfer.files); };
}

  if (UI.aMun && UI.aMun !== 'Todos os pilotos' && PIL().map(norm).indexOf(norm(UI.aMun)) < 0) UI.aMun = '';
  var locais = PIL().slice(); if (todos.some(function (a) { return a.onde === 'Todos os pilotos'; })) locais.push('Todos os pilotos');
  var passa = function (a, ign) {
    return (ign === 'g' || !UI.aGrav || a.g === UI.aGrav) && (ign === 'm' || !UI.aMun || norm(a.onde) === norm(UI.aMun)) && (ign === 't' || !UI.aTema || a.tema === UI.aTema);
  };

  }).join('') + '<div class="ak ak-total"><span>Total</span><b>' + baseG.length + '</b><small>alertas ativos</small></div></div>';

  /* 2. mapa município × tema */
  var baseM = todos.filter(function (a) { return passa(a, 'm') && passa(a, 't'); });
  var mapa = '<table class="amapa"><thead><tr><th>Município</th><th>Regional</th>' + TEMAS.map(function (t) { return '<th>' + t + '</th>'; }).join('') + '<th>Total</th></tr></thead><tbody>' +
    locais.map(function (m) {
      var da = baseM.filter(function (a) { return norm(a.onde) === norm(m); });
      var sel = norm(UI.aMun) === norm(m);
      return '<tr class="' + (sel ? 'sel' : '') + '"><th scope="row"><button class="alink" data-act="a-mun" data-v="' + esc(m) + '">' + (m === 'Todos os pilotos' ? '<i class="sw" style="background:var(--ink-3)"></i>' : '<i class="sw" style="background:' + corPiloto(m) + '"></i>') + esc(m) + '</button></th>' + (m === 'Todos os pilotos' ? '<td class="creg">—</td>' : cregP(m)) + '' +
        TEMAS.map(function (t) {
          var c = da.filter(function (a) { return a.tema === t; });
          if (!c.length) return '<td class="vz">·</td>';
          var g = Math.max.apply(null, c.map(function (a) { return a.g; }));
          return '<td><button class="acel ac-' + GRAV[g][1] + (UI.aTema === t && sel ? ' on' : '') + '" data-act="a-cel" data-m="' + esc(m) + '" data-t="' + t + '" title="' + esc(m) + ', ' + t + ': ' + c.length + (c.length === 1 ? ' alerta' : ' alertas') + '">' + c.length + '</button></td>';
        }).join('') + '<td class="tt">' + (da.length || '·') + '</td></tr>';
    }).join('') + '</tbody></table>';
  var mapaCard = card('Alertas por piloto e assunto', '<p class="hint">A cor mostra o alerta mais grave de cada quadro. Clique num número para ver só aqueles alertas.</p><div class="scroll">' + mapa + '</div>', 'span3');

  /* 3. barras por tema */
  var baseT = todos.filter(function (a) { return passa(a, 't'); });
  var maxT = Math.max.apply(null, TEMAS.map(function (t) { return baseT.filter(function (a) { return a.tema === t; }).length; }).concat([1]));
  var barras = TEMAS.map(function (t) {
    var c = baseT.filter(function (a) { return a.tema === t; }), on = UI.aTema === t;
    var seg = [3, 2, 1].map(function (g) { var n = c.filter(function (a) { return a.g === g; }).length; return n ? '<span class="bs-' + GRAV[g][1] + '" style="width:' + (n / maxT * 100) + '%"></span>' : ''; }).join('');
    return '<button class="atema' + (on ? ' on' : '') + '" data-act="a-tema" data-v="' + t + '" aria-pressed="' + on + '"><span class="an">' + t + '</span><span class="ab">' + seg + '</span><b>' + c.length + '</b></button>';
  }).join('');
  var temaCard = card('Alertas por assunto', '<p class="hint">Clique num assunto para filtrar.</p><div class="atemas">' + barras + '</div><div class="legend">' + [3, 2, 1].map(function (g) { return '<span><i class="bs-' + GRAV[g][1] + '"></i>' + GRAV[g][0] + '</span>'; }).join('') + '</div>', 'span3 tema-larg');

    '<label>Assunto <select data-act-change="a-tema"><option value="">Todos</option>' + TEMAS.map(function (t) { return '<option' + (t === UI.aTema ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label>' +
    '<label>Prioridade <select data-act-change="a-grav"><option value="0">Todas</option>' + [3, 2, 1].map(function (g) { return '<option value="' + g + '"' + (UI.aGrav === g ? ' selected' : '') + '>' + GRAV[g][0] + '</option>'; }).join('') + '</select></label>' +

  var semFiltros = !UI.aGrav && !UI.aMun && !UI.aTema, cortar = semFiltros && !UI.aTodos && lista.length > 12;
  var linhas = (cortar ? lista.slice(0, 12) : lista).map(function (a) {
    return '<tr><td><span class="pri pri-' + GRAV[a.g][1] + '">' + GRAV[a.g][2] + '</span></td><td class="amun">' + (a.onde === 'Todos os pilotos' ? '' : '<i class="sw" style="background:' + corPiloto(a.onde) + '"></i>') + esc(a.onde) + '</td>' + (a.onde === 'Todos os pilotos' ? '<td class="creg">—</td>' : cregP(a.onde)) +
      '<td><span class="tema">' + esc(a.tema) + '</span></td><td><b>' + esc(a.titulo || a.txt) + '</b>' + (a.titulo ? '<span class="sm det">' + esc(a.txt) + '</span>' : '') + '</td><td class="afz">' + esc(a.acao) + '</td></tr>';

    (linhas || '<tr><td colspan="6" class="empty">Nenhum alerta com estes filtros.</td></tr>') + '</tbody></table></div>' + (cortar ? '<button class="linkbtn" data-act="a-todos">Ver os outros ' + (lista.length - 12) + ' alertas (prioridade mais baixa)</button>' : (semFiltros && UI.aTodos ? '<button class="linkbtn" data-act="a-todos">Mostrar menos</button>' : ''));
  var tabCard = card('', '<div class="cardtop"><h2>Lista de alertas <span class="sm">' + lista.length + ' de ' + todos.length + '</span></h2></div>' + seg + tabela, 'span3');

  return placar + '<div class="g3">' + mapaCard + temaCard + tabCard + '</div>' + proximo('detalhes', 'Próximo passo: 4. Detalhes');
}
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  if (a === 'a-grav') { UI.aGrav = UI.aGrav === +v ? 0 : +v; render(); }
  else if (a === 'a-mun') { UI.aMun = norm(UI.aMun) === norm(v) ? '' : v; render(); }
  else if (a === 'a-tema') { UI.aTema = UI.aTema === v ? '' : v; render(); }
  else if (a === 'a-cel') { var m = b.getAttribute('data-m'), t = b.getAttribute('data-t'); if (norm(UI.aMun) === norm(m) && UI.aTema === t) { UI.aMun = ''; UI.aTema = ''; } else { UI.aMun = m; UI.aTema = t; } render(); }
  else if (a === 'a-todos') { UI.aTodos = !UI.aTodos; render(); }
  else if (a === 'a-limpar') { UI.aGrav = 0; UI.aMun = ''; UI.aTema = ''; render(); }
});
document.addEventListener('change', function (ev) {
  var t = ev.target, ac = t.getAttribute && t.getAttribute('data-act-change');
  if (ac === 'a-mun') { UI.aMun = t.value; render(); }
  else if (ac === 'a-tema') { UI.aTema = t.value; render(); }
  else if (ac === 'a-grav') { UI.aGrav = +t.value; render(); }
});

/* ===== v7: ranking entre pilotos ===== */
function posicoes(lista, chaveFn) {
  var ord = lista.slice().sort(function (a, b) { return chaveFn(b) - chaveFn(a); }), pos = 0, ant = null;
  ord.forEach(function (x, i) { var v = Math.round(chaveFn(x) * 1000); if (v !== ant) { pos = i + 1; ant = v; } x.pos = pos; });
  return ord;
}
function medalha(pos) { return '<span class="md md' + (pos <= 3 ? pos : 'n') + '">' + pos + 'º</span>'; }
function sinal(v, suf) { return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + (suf || ''); }

function dadosRanking() {
  var R = {};
  R.mat = posicoes(atuais().map(function (e) { return { p: e.municipio, v: e.indice, e: e }; }), function (x) { return x.v; });
  R.matFora = anteriores().map(function (e) { return { p: e.municipio, v: e.indice }; });
  R.avanco = posicoes(pilotosECP().filter(function (e) { var a = anteriorDe(e); return a && a.instrumento === e.instrumento; }).map(function (e) { var a = anteriorDe(e); return { p: e.municipio, v: e.indice - a.indice, de: a.indice, para: e.indice }; }), function (x) { return x.v; });
  var at = atuais(), dims = at.length ? at[0].dims.map(function (d) { return d.nome; }) : [];
  R.areas = dims.map(function (n) {
    var l = posicoes(at.map(function (e) { var d = e.dims.find(function (y) { return y.nome === n; }); return { p: e.municipio, v: d ? d.ader : 0 }; }), function (x) { return x.v; });
    var media = l.reduce(function (s, x) { return s + x.v; }, 0) / (l.length || 1);
    return { nome: n, lista: l, media: media };
  });
  R.lidera = {}; R.areas.forEach(function (a) { a.lista.filter(function (x) { return x.pos === 1; }).forEach(function (x) { R.lidera[x.p] = (R.lidera[x.p] || 0) + 1; }); });
  var fech = mesesFechados(), u3 = fech.slice(-3), a3 = fech.slice(-6, -3);
  R.u3 = u3; R.a3 = a3; R.atd = []; R.atdBase = [];
  if (u3.length === 3 && a3.length === 3) {
    PIL().forEach(function (p) {
      var a = atendDe(p); if (!a) return;
      var soma = function (ms) { return ms.reduce(function (s, m) { return s + (a.mensal[m] || 0); }, 0); };
      var u = soma(u3), v = soma(a3);
      if (v < 10) R.atdBase.push({ p: p, u: u, v: v }); else R.atd.push({ p: p, u: u, v: v, var: (u - v) / v });
    });
    R.atd = posicoes(R.atd, function (x) { return x.var; });
  }
  R.gestao = posicoes(pilotosECP().map(function (e) {
    var x = execucao(e), pz = x.total ? x.comPrazo / x.total : 0, cc = x.total ? x.concl / x.total : 0, ev = x.itens ? x.ev / x.itens : 0;
    return { p: e.municipio, pz: pz, cc: cc, ev: ev, atr: x.atras.length, v: (pz + cc + ev) / 3 };
  }), function (x) { return x.v; });
  return R;
}
